name: Build SiteMark Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check Android SDK packages
        run: |
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/34.0.0/apksigner"
      - name: Build installable APK
        run: bash build-android.sh
      - name: Verify APK signature and package
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose android-artifacts/SiteMark-Android.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging android-artifacts/SiteMark-Android.apk > android-artifacts/manifest-info.txt
          head -n 12 android-artifacts/manifest-info.txt
          sha256sum android-artifacts/SiteMark-Android.apk > android-artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SiteMark-Android
          path: android-artifacts/
      - name: Publish preview APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-v0.3.1 >/dev/null 2>&1; then
            echo 'The preview release already exists. Retaining it; this run is available as an artifact.'
          else
            gh release create android-v0.3.1 android-artifacts/SiteMark-Android.apk android-artifacts/SHA256SUMS.txt --title 'SiteMark Android 0.3.1' --notes 'Visual watermark library with editable titles and colours, plus single GPS address formatting. Android 10+ debug-signed preview; startup compatibility fix.' --prerelease
          fi
