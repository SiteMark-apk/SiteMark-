<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SiteMark — Site documentation</title>
<style>
:root{--gold:#F5C744;--dark:#15191E;--ink:#222a33;--muted:#596775;--line:#dce1e5;--bg:#f3f5f6}*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--bg)}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:8px;background:white;padding:10px 15px;font-weight:650;color:var(--ink)}button:hover{filter:brightness(.96)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #b48700;outline-offset:2px}.primary{background:var(--gold);border-color:var(--gold);color:var(--dark)}.shell{display:grid;grid-template-columns:245px 1fr;min-height:100vh}aside{background:var(--dark);color:white;padding:26px 18px;display:flex;flex-direction:column;gap:24px}.brand{display:flex;align-items:center;gap:12px;font-size:25px;font-weight:800;letter-spacing:-1px}.logo{background:var(--gold);color:var(--dark);width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-size:24px}.kicker{font-size:12px;letter-spacing:1.4px;font-weight:800;text-transform:uppercase;color:#a7b0bb}.nav{display:grid;gap:6px}.nav button{background:transparent;color:#cdd4db;border:none;text-align:left}.nav button.active{background:#333940;color:var(--gold)}.local{margin-top:auto;border-top:1px solid #454c54;padding:16px 4px;color:#aeb7c0;font-size:13px;line-height:1.65}.local b{color:var(--gold)}main{padding:32px clamp(18px,4vw,56px);max-width:1500px;width:100%;margin:auto;align-self:start}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:28px}.top h1{margin:0;font-size:34px;letter-spacing:-1.2px}.sub{color:var(--muted);margin:4px 0}.tag{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:13px;background:white;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:32px}.stat,.card,.panel{background:white;border:1px solid var(--line);border-radius:13px;padding:20px}.stat strong{font-size:32px;display:block;line-height:1.1;margin-bottom:7px}.stat span{color:var(--muted)}.stat:first-child{border-top:4px solid var(--gold)}.section{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 14px;flex-wrap:wrap}.section h2{margin:0;font-size:21px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}.card h3{margin:8px 0;font-size:21px}.card p{color:var(--muted);margin:4px 0 18px}.card .row{border-top:1px solid var(--line);padding-top:15px;display:flex;align-items:center;justify-content:space-between;gap:5px}.icon{width:44px;height:44px;display:grid;place-items:center;background:#fff5d1;border-radius:10px;color:#795800;font-size:23px}.empty{text-align:center;padding:48px 20px;border:2px dashed #cbd3da;border-radius:13px;color:var(--muted);background:#fafbfc}.empty h3{color:var(--ink);margin:10px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.photo{padding:0;overflow:hidden}.photo img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:#25292e}.photo .body{padding:14px}.photo .body p{margin:8px 0;overflow-wrap:anywhere}.photo small{color:var(--muted)}.note{margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}.note p{margin:4px 0}.note small{color:var(--muted)}dialog{border:0;border-radius:15px;padding:26px;width:min(500px,92vw);box-shadow:0 20px 70px #0005}dialog::backdrop{background:#15191e9c}dialog h2{margin-top:0}label{display:block;font-weight:650;margin:12px 0 5px}input:not([type=file]),textarea,select{width:100%;padding:10px 12px;border:1px solid #b8c1c9;border-radius:8px;background:white;color:var(--ink)}textarea{min-height:108px;resize:vertical}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.notice{position:fixed;bottom:22px;right:22px;background:var(--dark);color:white;padding:14px 20px;border-radius:9px;max-width:90vw;z-index:10}.danger{color:#a12727}.report{display:none}.search{max-width:310px}.drop{margin:0 0 18px;padding:24px;border:2px dashed #b8c1c9;border-radius:12px;background:white;text-align:center}.drop.drag{border-color:#b48700;background:#fff5d1}.drop p{margin:5px;color:var(--muted)}@media(max-width:750px){.shell{grid-template-columns:1fr}aside{padding:16px;gap:10px}.nav{display:flex;flex-wrap:wrap}.local{display:none}main{padding:20px 14px}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:24px}.top h1{font-size:28px}}@media print{body{background:white}.shell,dialog,.notice{display:none!important}.report{display:block;color:#15191e;padding:0}.report h1{border-bottom:5px solid #F5C744;padding-bottom:12px}.report article{break-inside:avoid;margin:16px 0}.report img{max-width:100%;max-height:440px;display:block}.report p{white-space:pre-wrap;overflow-wrap:anywhere}@page{margin:15mm}}
</style><body><div class="shell"><aside><div class="brand"><span class="logo">◩</span>SiteMark</div><div class="kicker">Workspace</div><nav class="nav" id="nav"></nav><div class="local"><b>● Local workspace</b><br>Photos and notes stay in this browser.<br>No cloud sync or sign-in.</div></aside><main id="main"></main></div><dialog id="dialog"></dialog><div id="notice" class="notice" hidden role="status"></div><div class="report" id="report"></div>
<script>
'use strict';
const $=id=>document.getElementById(id), main=$('main'), nav=$('nav'), dialog=$('dialog');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stamp=v=>new Date(v).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'}), uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);
let projects=[],photos=[],notes=[],current=null,query='',db,ready=false,noticeTimer;
const notify=m=>{clearTimeout(noticeTimer);$('notice').textContent=m;$('notice').hidden=false;noticeTimer=setTimeout(()=>$('notice').hidden=true,4500)};
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open('sitemark-workspace-v1',1);r.onupgradeneeded=()=>{for(const name of ['projects','photos','notes'])r.result.createObjectStore(name,{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function readStore(name){return new Promise((resolve,reject)=>{const r=db.transaction(name).objectStore(name).getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function write(name,item){return new Promise((resolve,reject)=>{const t=db.transaction(name,'readwrite');t.objectStore(name).put(item);t.oncomplete=resolve;t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error)})}
function remove(name,id){return new Promise((resolve,reject)=>{const t=db.transaction(name,'readwrite');t.objectStore(name).delete(id);t.oncomplete=resolve;t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error)})}
async function load(){[projects,photos,notes]=await Promise.all(['projects','photos','notes'].map(readStore));projects.sort((a,b)=>b.created-a.created);photos.sort((a,b)=>b.created-a.created);notes.sort((a,b)=>b.created-a.created)}
function stats(p){return [photos.filter(x=>x.project===p.id).length,notes.filter(x=>x.project===p.id).length]}
function render(){nav.innerHTML=`<button data-action="home" class="${current===null?'active':''}">▦ &nbsp; All projects</button><button data-action="new">＋ &nbsp; New project</button>`;const p=projects.find(x=>x.id===current);if(!p){current=null;home()}else detail(p)}
function home(){const list=projects.filter(p=>(p.name+' '+p.location).toLowerCase().includes(query.toLowerCase()));main.innerHTML=`<div class="top"><div><span class="tag">SITE DOCUMENTATION</span><h1>Projects</h1><p class="sub">Organise site visits, photographs and inspection records.</p></div><button class="primary" data-action="new">＋ New project</button></div><div class="stats"><div class="stat"><strong>${projects.length}</strong><span>Projects</span></div><div class="stat"><strong>${photos.length}</strong><span>Site photographs</span></div><div class="stat"><strong>${notes.length}</strong><span>Inspection notes</span></div></div><div class="section"><h2>Your projects</h2><input class="search" id="search" aria-label="Search projects" placeholder="Search projects…" value="${esc(query)}"></div><div id="project-list" class="grid">${list.length?list.map(card).join(''):`<div class="empty" style="grid-column:1/-1"><div class="icon" style="margin:auto">▦</div><h3>${query?'No matching projects':'Start your first project'}</h3><p>${query?'Try another search.':'Create a project to capture photos and record site observations.'}</p>${query?'':'<button class="primary" data-action="new">Create project</button>'}</div>`}</div>`}
function card(p){const [pc,nc]=stats(p);return `<article class="card"><div class="icon">▦</div><h3>${esc(p.name)}</h3><p>${esc(p.location||'No location provided')}</p><div class="row"><span>${pc} photos · ${nc} notes</span><button data-action="open" data-id="${p.id}">Open</button></div></article>`}
function detail(p){const ps=photos.filter(x=>x.project===p.id),ns=notes.filter(x=>x.project===p.id);main.innerHTML=`<div class="top"><div><button data-action="home">All projects</button><h1 style="margin-top:12px">${esc(p.name)}</h1><p class="sub">${esc(p.location||'No location provided')} · Created ${stamp(p.created)}</p></div><div class="actions"><button data-action="report">Export report / PDF</button><button class="primary" data-action="upload">＋ Add photos</button></div></div><div class="section"><h2>Site photographs <span class="tag">${ps.length}</span></h2></div><div class="drop" id="drop"><b>Drop site photos here</b><p>Or choose files. Each photo gets a visible SiteMark upload timestamp.</p><button data-action="upload">Choose photos</button><input id="files" type="file" accept="image/*" multiple hidden></div><div class="grid">${ps.length?ps.map(x=>`<article class="card photo"><img src="${esc(x.image)}" alt="${esc(x.name)}"><div class="body"><b>${esc(x.name)}</b><p><small>${stamp(x.created)} · Upload time</small></p><div class="actions"><button data-action="download" data-id="${x.id}">Download</button><button class="danger" data-action="remove-photo" data-id="${x.id}">Remove</button></div></div></article>`).join(''):'<div class="empty" style="grid-column:1/-1">No photos yet.</div>'}</div><div class="section"><h2>Inspection notes <span class="tag">${ns.length}</span></h2><button class="primary" data-action="note">＋ Add note</button></div>${ns.length?ns.map(n=>`<article class="panel note"><small>${stamp(n.created)}</small><p>${esc(n.text)}</p><div class="actions"><button data-action="edit-note" data-id="${n.id}">Edit</button><button class="danger" data-action="remove-note" data-id="${n.id}">Remove</button></div></article>`).join(''):'<div class="empty">No inspection notes yet.</div>'}`;const drop=$('drop');drop.ondragover=e=>{e.preventDefault();drop.classList.add('drag')};drop.ondragleave=()=>drop.classList.remove('drag');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('drag');upload([...e.dataTransfer.files],p.id)};$('files').onchange=e=>upload([...e.target.files],p.id)}
function showForm(title,fields,submit){dialog.innerHTML=`<form><h2>${title}</h2>${fields}<div class="dialog-actions"><button type="button" data-action="cancel">Cancel</button><button class="primary" type="submit">Save</button></div></form>`;dialog.querySelector('form').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('[type=submit]');b.disabled=true;try{await submit(new FormData(e.target));dialog.close();await load();render();notify('Saved to this browser.')}catch(err){notify('Could not save: '+err.message);b.disabled=false}};dialog.showModal()}
function newProject(){showForm('New project','<label for="name">Project name</label><input id="name" name="name" required maxlength="120" autofocus><label for="location">Site address or location</label><input id="location" name="location" maxlength="180">',async f=>{const name=f.get('name').trim();if(!name)throw Error('Enter a project name');const p={id:uid(),name,location:f.get('location').trim(),created:Date.now()};await write('projects',p);current=p.id;query=''})}
function noteForm(n){showForm(n?'Edit inspection note':'Add inspection note',`<label for="text">Observation / action required</label><textarea id="text" name="text" required maxlength="10000" autofocus>${esc(n?.text||'')}</textarea>`,async f=>{const text=f.get('text').trim();if(!text)throw Error('Enter a note');await write('notes',{id:n?.id||uid(),project:current,created:n?.created||Date.now(),text})})}
function imageStamp(file,p,time){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{try{const s=Math.min(1,1800/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);const size=Math.max(8,Math.round(c.width*.032)),h=Math.min(c.height,Math.round(size*3.5));g.fillStyle='#15191ee8';g.fillRect(0,c.height-h,c.width,h);g.fillStyle='#F5C744';g.font=`bold ${size}px sans-serif`;g.fillText('SiteMark  |  '+p.name,size,c.height-h+size*1.3,c.width-size*2);g.fillStyle='#fff';g.font=`${size*.78}px sans-serif`;g.fillText(stamp(time)+'  ·  Upload time',size,c.height-h+size*2.6,c.width-size*2);resolve(c.toDataURL('image/jpeg',.86))}catch(e){reject(e)}finally{URL.revokeObjectURL(url)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Unsupported image format'))};img.src=url})}
async function upload(files,id){const p=projects.find(x=>x.id===id);if(!p||!files.length)return;let count=0,failed=0;notify('Processing photos…');for(const f of files){try{if(!f.type.startsWith('image/')||f.size>40*1024*1024)throw Error('Invalid image');const created=Date.now(),image=await imageStamp(f,p,created);await write('photos',{id:uid(),project:id,created,name:f.name,image});count++}catch(e){failed++}}await load();render();notify(`${count} photo(s) saved${failed?`; ${failed} failed (unsupported, too large, or storage full)`:''}.`)}
function exportReport(){const p=projects.find(x=>x.id===current);if(!p)return;const ps=photos.filter(x=>x.project===p.id),ns=notes.filter(x=>x.project===p.id);$('report').innerHTML=`<h1>SiteMark | Inspection report</h1><h2>${esc(p.name)}</h2><p>${esc(p.location||'Location not recorded')}<br>Report generated: ${stamp(Date.now())}</p><h2>Inspection notes (${ns.length})</h2>${ns.map(n=>`<article><b>${stamp(n.created)}</b><p>${esc(n.text)}</p></article>`).join('')||'<p>No inspection notes.</p>'}<h2>Site photographs (${ps.length})</h2>${ps.map(x=>`<article><img src="${esc(x.image)}" alt="${esc(x.name)}"><p>${esc(x.name)} · ${stamp(x.created)} (upload time)</p></article>`).join('')||'<p>No photos.</p>'}`;window.print()}
function download(x){const a=document.createElement('a');a.href=x.image;a.download='SiteMark-'+x.name.replace(/\.[^.]+$/,'')+'.jpg';a.click()}
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;const list=projects.filter(p=>(p.name+' '+p.location).toLowerCase().includes(query.toLowerCase()));$('project-list').innerHTML=list.length?list.map(card).join(''):'<div class="empty" style="grid-column:1/-1">No matching projects.</div>'}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b||!ready)return;const {action,id}=b.dataset;try{switch(action){case'home':current=null;query='';render();break;case'new':newProject();break;case'open':current=id;render();break;case'cancel':dialog.close();break;case'upload':$('files').click();break;case'note':noteForm();break;case'edit-note':noteForm(notes.find(x=>x.id===id));break;case'download':download(photos.find(x=>x.id===id));break;case'report':exportReport();break;case'remove-photo':case'remove-note':if(confirm('Remove this record from this browser?')){await remove(action==='remove-photo'?'photos':'notes',id);await load();render();notify('Record removed.')}break}}catch(err){notify('Action failed: '+err.message)}});
(async()=>{try{db=await openDB();await load();ready=true;render()}catch(e){main.innerHTML='<div class="empty"><h2>Local storage unavailable</h2><p>Open SiteMark in a regular browser window with site storage enabled. Your data has not been reset.</p></div>';notify('Could not open local workspace.')}})();
</script></body></html>
